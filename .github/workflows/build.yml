name: Build and test Windows app
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build and run configuration tests
        shell: powershell
        run: ./scripts/test.ps1
      - name: Package portable app
        shell: powershell
        run: ./scripts/package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: DesktopFolders-windows-x64
          path: |
            artifacts/*.zip
            artifacts/*.sha256
